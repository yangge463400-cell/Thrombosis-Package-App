spring:
  datasource:
    url: jdbc:mysql://localhost:3306/thrombosis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

thrombosis:
  jwt:
    # HS256 密钥（>=32 字节），生产环境务必通过环境变量覆盖
    secret: thrombosis-app-jwt-secret-key-2026-0811-07180042-abcdefg
    expire-hours: 168
  dev:
    mock:
      # 开发态模拟开关（无真实微信凭据即可跑通全流程）
      verify-code: "123456"          # 短信验证码固定值
      openid-prefix: "mock_openid_"  # wx.login code 任意值映射的测试 openid 前缀
      payment: true                  # 允许 /api/payment/mock-callback 模拟微信支付回调
